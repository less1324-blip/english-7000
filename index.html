            align-items: center;

            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            margin: 30px 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--primary-color);
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
            background: #fff;

        }

            margin: 0 0 4px 0;
            font-size: 16px;
            color: var(--primary-color);
        }

        .word-info p {
            margin: 0;
            color: #475569;
            font-size: 14px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        }

            font-family: monospace;
            height: 300px;
            background: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 6px;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
            resize: vertical;

</head>
<body>

<div class="container">
    <header>
        <h1>📚 4000單字與片語美式語音系統</h1>
        <p>強制指定美式口音、智慧處理 sb./sth. 縮寫</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('manage')">📝 單字與片語清單</button>
        <button class="tab-btn" onclick="switchTab('export')">🌐 GitHub JSON 專用區</button>
    </div>

    <div id="tab-manage" class="tab-content active">
        <div class="quick-jump-bar">
            <label for="unitJumpSelect" style="font-weight: 600; white-space: nowrap;">📂 選擇單元跳轉：</label>
            <select id="unitJumpSelect" onchange="jumpToUnit(this.value)">
                <option value="">-- 請選擇單元 --</option>
            </select>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">總覽清單 (<span id="wordCount">0</span> 筆)</h3>
            <div id="wordListContainer"></div>
        </div>
    </div>

    <div id="tab-export" class="tab-content">
        <div class="card">
            <h3>GitHub JSON 格式內容</h3>
            <textarea id="jsonOutput" class="json-box" readonly></textarea>
            <div style="margin-top: 15px;">
                <button onclick="downloadJSON()">下載 words.json 檔案</button>
            </div>
        </div>
    </div>
</div>

    function parseRawText(text) {
        const lines = text.split('\n');
        let currentUnit = "未分類";
        const list = [];
        let globalId = 1;

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            if (line.startsWith('#')) {
                currentUnit = line.replace(/^#+\s*/, '');
                return;
            }

            let cleanLine = line.replace(/^\d+[\.\)]\s*/, '').trim();
            let match = cleanLine.match(/^([a-zA-Z\s\.\/]+)([\s\S]*)$/);
            
            if (match) {
                let word = match[1].trim();
                let definition = match[2].trim();
                
                if (word) {
                    list.push({
                        id: globalId++,
                        unit: currentUnit,
                        word: word,
                        definition: definition || ""
                    });
                }
            }
        });
        return list;
    }

    const wordsList = parseRawText(rawText);

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'manage') {
            document.querySelector('.tabs button:nth-child(1)').classList.add('active');
            document.getElementById('tab-manage').classList.add('active');
        } else if (tabName === 'export') {
            document.querySelector('.tabs button:nth-child(2)').classList.add('active');
            document.getElementById('tab-export').classList.add('active');
            document.getElementById('jsonOutput').value = JSON.stringify(wordsList, null, 4);
        }
    }

    // 強制指定美式口音的智慧發音函式
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            
            let processedText = text
                .replace(/\bsb\.?\b/gi, 'somebody')
                .replace(/\bsth\.?\b/gi, 'something')
                .replace(/…/g, '')
                .trim();

            const utterance = new SpeechSynthesisUtterance(processedText);
            
            // 強制設定為美式英文口音
            utterance.lang = 'en-US';
            utterance.rate = 0.85; // 語速稍微調慢

            // 自動尋找裝置中最好的美式語音（Voice）
            const voices = window.speechSynthesis.getVoices();
            const usVoice = voices.find(voice => voice.lang === 'en-US' || voice.lang === 'en_US');
            if (usVoice) {
                utterance.voice = usVoice;
            }
            
            window.speechSynthesis.speak(utterance);
        } else {
            alert('您的瀏覽器不支援語音功能');
        }
    }

    // 某些瀏覽器需要預先載入語音清單
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    function renderList() {
        const container = document.getElementById('wordListContainer');
        const select = document.getElementById('unitJumpSelect');
        document.getElementById('wordCount').innerText = wordsList.length;

        container.innerHTML = '';
        select.innerHTML = '<option value="">-- 請選擇單元 --</option>';

        let grouped = {};
        wordsList.forEach(item => {
            if (!grouped[item.unit]) grouped[item.unit] = [];
            grouped[item.unit].push(item);
        });

        for (let unitName in grouped) {
            const unitHeader = document.createElement('div');
            unitHeader.className = 'unit-title';
            unitHeader.id = `unit-${CSS.escape(unitName)}`;
            unitHeader.innerText = unitName;
            container.appendChild(unitHeader);

            const option = document.createElement('option');
            option.value = unitName;
            option.text = unitName;
            select.appendChild(option);

            grouped[unitName].forEach(item => {
                const div = document.createElement('div');
                div.className = 'word-card';
                const safeWord = item.word.replace(/'/g, "\\'");
                
                div.innerHTML = `
                    <div class="word-info">
                        <h4>${item.word}</h4>
                        <p><strong>釋義：</strong>${item.definition}</p>
                    </div>
                    <div>
                        <button onclick="speak('${safeWord}')">🔊 聽發音</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    }

    function jumpToUnit(unitName) {
        if (!unitName) return;
        const targetElement = document.getElementById(`unit-${CSS.escape(unitName)}`);
        if (targetElement) {
            targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function downloadJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(wordsList, null, 4));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "words.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    renderList();
</script>
